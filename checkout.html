<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈샵 — 결제</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>

<div id="header"></div>

<main class="container">
  <h1 class="page-title">결제하기</h1>
  <p class="page-desc">테스트 모드입니다. 실제로 돈이 빠져나가지 않습니다.</p>

  <div id="content">
    <div class="loading"><div class="spinner"></div>준비 중…</div>
  </div>
</main>

<script type="module">
import { supabase, formatWon, escapeHtml } from './assets/js/supabase.js';
import { renderHeader, requireLogin } from './assets/js/auth.js';
import { TOSS_CLIENT_KEY, isTossConfigured, siteUrl } from './assets/js/config.js';

renderHeader('');

const content = document.getElementById('content');

// ---- 1. 로그인 확인 ----------------------------------------
const user = await requireLogin();
if (!user) throw new Error('redirecting');   // login.html 로 이동 중

// ---- 2. 어떤 상품인지 확인 ---------------------------------
const productId = Number(new URLSearchParams(location.search).get('product'));
if (!productId) {
  showError('어떤 상품인지 알 수 없습니다.', '상품 목록에서 다시 선택해 주세요.');
  throw new Error('no product');
}

const { data: product, error: productError } = await supabase
  .from('products')
  .select('id, name, description, price, emoji, color, stock')
  .eq('id', productId)
  .maybeSingle();

if (productError || !product) {
  showError('상품을 찾을 수 없습니다.', productError?.message ?? '판매가 중단된 상품일 수 있습니다.');
  throw new Error('product not found');
}

if (!isTossConfigured()) {
  showError(
    '토스페이먼츠 설정이 필요합니다.',
    'assets/js/config.js 의 TOSS_CLIENT_KEY 를 채워주세요.'
  );
  throw new Error('toss not configured');
}

// ---- 3. 화면 그리기 ----------------------------------------
const maxQty = Math.min(product.stock, 10);

content.innerHTML = `
  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:24px;align-items:start"
       id="layout">

    <div>
      <div id="payment-method"></div>
      <div id="agreement"></div>
    </div>

    <div class="card">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:18px">
        <div style="width:64px;height:64px;border-radius:10px;display:grid;place-items:center;
                    font-size:30px;background:${escapeHtml(product.color)}20;flex:none">
          ${escapeHtml(product.emoji)}
        </div>
        <div style="min-width:0">
          <div style="font-weight:700">${escapeHtml(product.name)}</div>
          <div style="font-size:13px;color:var(--text-muted)">${escapeHtml(product.description)}</div>
        </div>
      </div>

      <div class="form-row">
        <label for="qty">수량</label>
        <select id="qty">
          ${Array.from({ length: maxQty }, (_, i) =>
            `<option value="${i + 1}">${i + 1}개</option>`).join('')}
        </select>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>상품 금액</span><span id="unit">${formatWon(product.price)}</span>
        </div>
        <div class="summary-row">
          <span>수량</span><span id="qty-label">1개</span>
        </div>
        <div class="summary-row total">
          <span>총 결제금액</span><span id="total">${formatWon(product.price)}</span>
        </div>
      </div>

      <div id="pay-message" style="margin-top:14px"></div>

      <button class="btn btn-block btn-lg" id="pay-btn" style="margin-top:14px">
        ${formatWon(product.price)} 결제하기
      </button>
    </div>
  </div>`;

// 모바일에서는 한 줄로
if (window.matchMedia('(max-width: 860px)').matches) {
  document.getElementById('layout').style.gridTemplateColumns = '1fr';
}

const qtySelect  = document.getElementById('qty');
const qtyLabel   = document.getElementById('qty-label');
const totalLabel = document.getElementById('total');
const payBtn     = document.getElementById('pay-btn');
const payMessage = document.getElementById('pay-message');

// ---- 4. 토스 결제위젯 띄우기 --------------------------------
// customerKey: 이 사람을 구분하는 값. 로그인 계정 ID를 씁니다.
const widgets = TossPayments(TOSS_CLIENT_KEY).widgets({ customerKey: user.id });

let amount = product.price;

await widgets.setAmount({ currency: 'KRW', value: amount });
await Promise.all([
  widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
  widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
]);

qtySelect.addEventListener('change', async () => {
  const qty = Number(qtySelect.value);
  amount = product.price * qty;
  qtyLabel.textContent = `${qty}개`;
  totalLabel.textContent = formatWon(amount);
  payBtn.textContent = `${formatWon(amount)} 결제하기`;
  await widgets.setAmount({ currency: 'KRW', value: amount });
});

// ---- 5. 결제 요청 ------------------------------------------
payBtn.addEventListener('click', async () => {
  payBtn.disabled = true;
  payBtn.textContent = '주문 생성 중…';
  payMessage.innerHTML = '';

  try {
    // ★ 금액은 보내지 않습니다. 데이터베이스가 직접 계산합니다.
    //    (자세한 이유는 ARCH.md의 create_order 설명 참고)
    const { data, error } = await supabase.rpc('create_order', {
      p_product_id: product.id,
      p_quantity: Number(qtySelect.value),
    });

    if (error) throw new Error(error.message);

    const order = Array.isArray(data) ? data[0] : data;
    if (!order?.order_code) throw new Error('주문 생성에 실패했습니다.');

    // 데이터베이스가 계산한 금액을 최종 기준으로 삼습니다.
    if (order.amount !== amount) {
      amount = order.amount;
      await widgets.setAmount({ currency: 'KRW', value: amount });
    }

    payBtn.textContent = '결제창으로 이동 중…';

    await widgets.requestPayment({
      orderId:   order.order_code,
      orderName: order.product_name,
      successUrl: siteUrl('success.html'),
      failUrl:    siteUrl('fail.html'),
      customerEmail: user.email,
    });
    // 여기서 토스 결제창으로 넘어갑니다.
  } catch (err) {
    payMessage.innerHTML =
      `<div class="alert alert-error">${escapeHtml(err.message ?? '결제를 시작하지 못했습니다.')}</div>`;
    payBtn.disabled = false;
    payBtn.textContent = `${formatWon(amount)} 결제하기`;
  }
});

function showError(title, detail) {
  content.innerHTML = `
    <div class="result">
      <div class="icon">⚠️</div>
      <h1>${escapeHtml(title)}</h1>
      <p>${escapeHtml(detail)}</p>
      <a class="btn" href="index.html">상품 목록으로</a>
    </div>`;
}
</script>

</body>
</html>
