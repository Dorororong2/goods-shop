<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈샵 — 결제 처리 중</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      결제를 승인하는 중입니다. 창을 닫지 말아주세요…
    </div>
  </div>
</main>

<script type="module">
import { supabase, formatWon, formatDate, escapeHtml } from './assets/js/supabase.js';
import { renderHeader, requireLogin } from './assets/js/auth.js';

renderHeader('');

const content = document.getElementById('content');

const user = await requireLogin();
if (!user) throw new Error('redirecting');

// 토스가 붙여서 돌려보낸 값들
const params     = new URLSearchParams(location.search);
const paymentKey = params.get('paymentKey');
const orderCode  = params.get('orderId');      // 우리 DB의 order_code
const amount     = Number(params.get('amount'));

if (!paymentKey || !orderCode || !amount) {
  showResult('⚠️', '잘못된 접근입니다', '결제 정보가 없습니다. 상품 목록에서 다시 시도해 주세요.');
  throw new Error('missing params');
}

// ------------------------------------------------------------
// Edge Function 에게 "이 결제 승인해줘" 요청
//
// 로그인 토큰은 supabase-js 가 자동으로 붙여줍니다.
// 서버는 이 토큰으로 "정말 이 사람 주문이 맞는지", "금액이 맞는지"를
// 다시 확인한 뒤에야 토스에 승인을 요청합니다.
// ------------------------------------------------------------
const { data, error } = await supabase.functions.invoke('confirm-payment', {
  body: { paymentKey, orderCode, amount },
});

if (error) {
  // Edge Function 이 에러를 반환하면 본문에 자세한 메시지가 들어 있습니다.
  let detail = error.message;
  try {
    const body = await error.context?.json?.();
    if (body?.message) detail = body.message;
  } catch { /* 본문을 못 읽으면 기본 메시지 사용 */ }

  showResult('❌', '결제 승인에 실패했습니다', detail, 'orders.html', '내 결제 내역 보기');
} else {
  const order = data.order;
  content.innerHTML = `
    <div class="result">
      <div class="icon">✅</div>
      <h1>결제가 완료되었습니다</h1>
      <p>테스트 결제라 실제로 돈이 빠져나가지 않았습니다.</p>

      <div class="card">
        <div class="summary" style="border-top:none;margin-top:0;padding-top:0">
          <div class="summary-row"><span>상품</span><span>${escapeHtml(order.product_name)}</span></div>
          <div class="summary-row"><span>수량</span><span>${order.quantity}개</span></div>
          <div class="summary-row"><span>결제수단</span><span>${escapeHtml(order.method ?? '-')}</span></div>
          <div class="summary-row"><span>주문번호</span>
            <span style="font-size:12px">${escapeHtml(order.order_code)}</span></div>
          <div class="summary-row"><span>승인시각</span><span>${formatDate(order.approved_at)}</span></div>
          <div class="summary-row total"><span>결제금액</span><span>${formatWon(order.amount)}</span></div>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:20px">
        <a class="btn btn-secondary btn-block" href="index.html">쇼핑 계속하기</a>
        <a class="btn btn-block" href="orders.html">내 결제 내역</a>
      </div>
    </div>`;
}

function showResult(icon, title, detail, href = 'index.html', label = '상품 목록으로') {
  content.innerHTML = `
    <div class="result">
      <div class="icon">${icon}</div>
      <h1>${escapeHtml(title)}</h1>
      <p>${escapeHtml(detail)}</p>
      <a class="btn" href="${href}">${escapeHtml(label)}</a>
    </div>`;
}
</script>

</body>
</html>
