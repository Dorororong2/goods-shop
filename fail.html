<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈샵 — 결제 실패</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <div class="result">
    <div class="icon">😢</div>
    <h1>결제가 완료되지 않았습니다</h1>
    <p id="reason">결제가 취소되었거나 실패했습니다.</p>

    <div class="card" id="detail" hidden>
      <div class="summary" style="border-top:none;margin-top:0;padding-top:0">
        <div class="summary-row"><span>오류 코드</span><span id="code">-</span></div>
        <div class="summary-row"><span>주문번호</span><span id="order" style="font-size:12px">-</span></div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:20px">
      <a class="btn btn-secondary btn-block" href="index.html">상품 목록으로</a>
      <a class="btn btn-block" href="orders.html">내 결제 내역</a>
    </div>
  </div>
</main>

<script type="module">
import { escapeHtml } from './assets/js/supabase.js';
import { renderHeader } from './assets/js/auth.js';

renderHeader('');

// 토스가 실패 사유를 쿼리로 붙여서 보내줍니다.
const params  = new URLSearchParams(location.search);
const code    = params.get('code');
const message = params.get('message');
const orderId = params.get('orderId');

if (message) {
  document.getElementById('reason').textContent = message;
}

if (code || orderId) {
  document.getElementById('detail').hidden = false;
  document.getElementById('code').textContent  = code ?? '-';
  document.getElementById('order').textContent = orderId ?? '-';
}

// 사용자가 직접 취소한 경우는 오류가 아니므로 문구를 부드럽게 바꿉니다.
if (code === 'PAY_PROCESS_CANCELED') {
  document.querySelector('.result h1').textContent = '결제를 취소했습니다';
  document.getElementById('reason').textContent =
    '언제든 다시 결제하실 수 있습니다.';
}
</script>

</body>
</html>
